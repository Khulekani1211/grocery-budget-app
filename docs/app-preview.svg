<svg width="400" height="900" viewBox="0 0 400 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- phone frame -->
  <rect width="400" height="900" rx="32" fill="#F6F1E4"/>
  <rect x="4" y="4" width="392" height="892" rx="28" fill="none" stroke="#262620" stroke-width="8"/>
  <rect x="150" y="16" width="100" height="16" rx="8" fill="#262620"/>

  <!-- header -->
  <g transform="translate(28,44)">
    <path d="M2 6 L26 6 L23 20 Q22 24 18 24 L10 24 Q6 24 5 20 Z" fill="none" stroke="#3F6B4E" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M8 6 L14 -2 L20 6" fill="none" stroke="#3F6B4E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="16" font-family="Space Grotesk, Arial, sans-serif" font-size="22" font-weight="700" fill="#262620">Grocery Budget</text>
  </g>
  <text x="28" y="84" font-family="Inter, Arial, sans-serif" font-size="12" fill="#262620" opacity="0.6">Track every trip, Rand by Rand.</text>

  <!-- budget card -->
  <rect x="24" y="102" width="352" height="148" rx="20" fill="#FFFDF8"/>
  <text x="44" y="150" font-family="'IBM Plex Mono', monospace" font-size="30" font-weight="700" fill="#262620">R 412.50</text>
  <text x="44" y="170" font-family="Inter, Arial, sans-serif" font-size="12" fill="#262620" opacity="0.6">left to spend</text>

  <circle cx="352" cy="128" r="16" fill="#F6F1E4"/>
  <path d="M347 133 L357 123 M354 120 L360 126" stroke="#262620" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

  <rect x="44" y="196" width="312" height="10" rx="5" fill="#E4DAC0"/>
  <rect x="44" y="196" width="182" height="10" rx="5" fill="#3F6B4E"/>
  <text x="44" y="228" font-family="Inter, Arial, sans-serif" font-size="11" fill="#262620" opacity="0.55">Spent R 587.50</text>
  <text x="356" y="228" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="11" fill="#262620" opacity="0.55">Budget R 1000.00</text>

  <!-- staples -->
  <text x="24" y="282" font-family="Space Grotesk, Arial, sans-serif" font-size="17" font-weight="700" fill="#262620">Staples</text>
  <rect x="24" y="296" width="352" height="212" rx="20" fill="#FFFDF8"/>

  <!-- row: bread (checked) -->
  <circle cx="46" cy="326" r="9" fill="#3F6B4E"/>
  <path d="M42 326 L45 329 L51 322" stroke="#FFFDF8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="330" font-family="Inter, Arial, sans-serif" font-size="13" fill="#262620" opacity="0.45" text-decoration="line-through">Bread</text>
  <text x="356" y="330" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#262620">R 18.00</text>
  <line x1="40" y1="346" x2="360" y2="346" stroke="#E4DAC0" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- row: milk (unchecked) -->
  <circle cx="46" cy="368" r="9" fill="none" stroke="#B99B6B" stroke-width="2"/>
  <text x="64" y="372" font-family="Inter, Arial, sans-serif" font-size="13" fill="#262620">Milk (2L)</text>
  <text x="356" y="372" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#262620" opacity="0.4">~R 32</text>
  <line x1="40" y1="388" x2="360" y2="388" stroke="#E4DAC0" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- row: eggs (checked) -->
  <circle cx="46" cy="410" r="9" fill="#3F6B4E"/>
  <path d="M42 410 L45 413 L51 406" stroke="#FFFDF8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="414" font-family="Inter, Arial, sans-serif" font-size="13" fill="#262620" opacity="0.45" text-decoration="line-through">Eggs (18)</text>
  <text x="356" y="414" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#262620">R 42.00</text>
  <line x1="40" y1="430" x2="360" y2="430" stroke="#E4DAC0" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- row: rice (unchecked) -->
  <circle cx="46" cy="452" r="9" fill="none" stroke="#B99B6B" stroke-width="2"/>
  <text x="64" y="456" font-family="Inter, Arial, sans-serif" font-size="13" fill="#262620">Rice (2kg)</text>
  <text x="356" y="456" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#262620" opacity="0.4">~R 55</text>

  <text x="200" y="494" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#3F6B4E">+ Add staple</text>

  <!-- extras -->
  <text x="24" y="540" font-family="Space Grotesk, Arial, sans-serif" font-size="17" font-weight="700" fill="#262620">Extras</text>
  <rect x="24" y="554" width="352" height="120" rx="20" fill="#FFFDF8"/>

  <rect x="44" y="572" width="188" height="34" rx="8" fill="#F6F1E4"/>
  <text x="54" y="593" font-family="Inter, Arial, sans-serif" font-size="12" fill="#262620" opacity="0.4">What are you adding?</text>
  <rect x="240" y="572" width="56" height="34" rx="8" fill="#F6F1E4"/>
  <text x="250" y="593" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#262620" opacity="0.4">0</text>
  <circle cx="322" cy="589" r="17" fill="#3F6B4E"/>
  <path d="M322 582 L322 596 M315 589 L329 589" stroke="#FFFDF8" stroke-width="2.2" stroke-linecap="round"/>

  <text x="44" y="634" font-family="Inter, Arial, sans-serif" font-size="13" fill="#262620">Chocolate</text>
  <text x="356" y="634" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#262620">R 25.00</text>

  <!-- receipt -->
  <rect x="24" y="700" width="352" height="150" rx="20" fill="#FFFDF8"/>
  <text x="200" y="726" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="2" fill="#262620" opacity="0.5">TODAY'S RECEIPT</text>

  <text x="44" y="750" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#262620">Bread</text>
  <text x="356" y="750" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#262620">R 18.00</text>
  <line x1="44" y1="758" x2="356" y2="758" stroke="#E4DAC0" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="44" y="776" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#262620">Eggs (18)</text>
  <text x="356" y="776" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#262620">R 42.00</text>
  <line x1="44" y1="784" x2="356" y2="784" stroke="#E4DAC0" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="44" y="802" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#262620">Chocolate</text>
  <text x="356" y="802" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#262620">R 25.00</text>

  <line x1="44" y1="816" x2="356" y2="816" stroke="#262620" stroke-width="2"/>
  <text x="44" y="836" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#262620">TOTAL</text>
  <text x="356" y="836" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#262620">R 85.00</text>

  <!-- torn paper edge under the receipt -->
  <rect x="24" y="850" width="352" height="12" fill="#FFFDF8"/>
  <polygon points="24,862 40,850 56,862 72,850 88,862 104,850 120,862 136,850 152,862 168,850 184,862 200,850 216,862 232,850 248,862 264,850 280,862 296,850 312,862 328,850 344,862 360,850 376,862"
           fill="#F6F1E4"/>

  <!-- new trip pill -->
  <text x="200" y="892" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#262620" opacity="0.55">↺  New trip</text>
</svg>
